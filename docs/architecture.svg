<svg viewBox="0 0 980 480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="980" height="480" fill="#f8fafc"/>

  <!-- Vercel container -->
  <rect x="30" y="40" width="260" height="180" rx="14" fill="none" stroke="#94a3b8" stroke-dasharray="6 5" stroke-width="1.5"/>
  <text x="45" y="65" font-size="13" fill="#64748b" font-weight="600">VERCEL</text>

  <!-- Railway container -->
  <rect x="360" y="40" width="300" height="400" rx="14" fill="none" stroke="#94a3b8" stroke-dasharray="6 5" stroke-width="1.5"/>
  <text x="375" y="65" font-size="13" fill="#64748b" font-weight="600">RAILWAY</text>

  <!-- React box -->
  <rect x="55" y="90" width="210" height="110" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="130" font-size="16" fill="#1e3a8a" font-weight="700" text-anchor="middle">React (Vite)</text>
  <text x="160" y="152" font-size="12.5" fill="#1e40af" text-anchor="middle">Customer / Agent / Admin</text>
  <text x="160" y="172" font-size="12.5" fill="#1e40af" text-anchor="middle">React Router · Axios</text>

  <!-- Django box -->
  <rect x="385" y="90" width="250" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="510" y="128" font-size="16" fill="#14532d" font-weight="700" text-anchor="middle">Django + DRF API</text>
  <text x="510" y="150" font-size="12.5" fill="#166534" text-anchor="middle">JWT auth</text>
  <text x="510" y="168" font-size="12.5" fill="#166534" text-anchor="middle">Role-based permissions</text>
  <text x="510" y="186" font-size="12.5" fill="#166534" text-anchor="middle">(customer / agent / admin)</text>

  <!-- PostgreSQL box -->
  <rect x="385" y="330" width="250" height="90" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="510" y="370" font-size="16" fill="#312e81" font-weight="700" text-anchor="middle">PostgreSQL</text>
  <text x="510" y="392" font-size="12.5" fill="#3730a3" text-anchor="middle">via Django ORM</text>

  <!-- Gemini box -->
  <rect x="720" y="90" width="230" height="130" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="835" y="128" font-size="16" fill="#78350f" font-weight="700" text-anchor="middle">Gemini API</text>
  <text x="835" y="150" font-size="12.5" fill="#92400e" text-anchor="middle">Classifies category</text>
  <text x="835" y="168" font-size="12.5" fill="#92400e" text-anchor="middle">and priority, writes a</text>
  <text x="835" y="186" font-size="12.5" fill="#92400e" text-anchor="middle">summary + draft reply</text>
  <text x="835" y="207" font-size="11.5" fill="#b45309" text-anchor="middle" font-style="italic">(external, by Google)</text>

  <!-- Arrow: React -> Django -->
  <line x1="266" y1="145" x2="382" y2="145" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="324" y="130" font-size="11.5" fill="#334155" text-anchor="middle">HTTPS</text>
  <text x="324" y="143" font-size="11.5" fill="#334155" text-anchor="middle">+ JWT</text>

  <!-- Arrow: Django -> Postgres -->
  <line x1="510" y1="210" x2="510" y2="327" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="540" y="272" font-size="11.5" fill="#334155">ORM</text>

  <!-- Arrow: Django -> Gemini -->
  <line x1="637" y1="140" x2="717" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="677" y="126" font-size="11" fill="#334155" text-anchor="middle">on ticket</text>
  <text x="677" y="138" font-size="11" fill="#334155" text-anchor="middle">creation</text>

  <!-- Footer note -->
  <text x="490" y="460" font-size="12.5" fill="#64748b" text-anchor="middle">
    If the Gemini call fails, the ticket is still created — the AI suggestion is simply left pending.
  </text>
</svg>
